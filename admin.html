<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Zednationmusic</title><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html">ZEDNATION<span>MUSIC</span></a><nav><a href="index.html">Website</a></nav></header><main id="loginBox"><h1>Admin Login</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login" class="btn">Log in</button><button id="resetPassword" type="button" class="btn secondary">Forgot password?</button><p id="loginStatus"></p></main><main id="dash" hidden><h1>Upload Music</h1><p>MP3/audio files are stored in Cloudinary. Song details are stored in Firebase.</p><form id="upload"><input id="title" required placeholder="Song title"><input id="artist" value="ASTROBOY ZM" required placeholder="Artist"><input id="audio" type="file" accept="audio/*,.mp3,.wav,.m4a" required><button class="btn">Upload Song</button><p id="uploadStatus"></p></form><button id="logout">Log out</button><div id="list"></div></main><script type="module" src="admin.js"></script></body></html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Zednationmusic</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="nav"><a class="logo" href="index.html">ZEDNATION<span>MUSIC</span></a><nav><a href="index.html">Website</a></nav></header>
<main class="section admin">
<p class="eyebrow">PRIVATE AREA</p><h1>Music Admin</h1>
<div id="loginBox" class="panel"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login" class="button">Log in</button><p id="loginStatus"></p></div>
<div id="dashboard" class="panel hidden"><div class="admin-top"><h2>Upload Music</h2><button id="logout" class="button small">Log out</button></div>
<form id="uploadForm"><input id="title" required placeholder="Song title"><input id="artist" value="ASTROBOY ZM" required placeholder="Artist"><input id="audio" type="file" accept="audio/*" required><input id="cover" type="url" placeholder="Cover image URL (optional)"><button class="button" type="submit">Upload Song</button><p id="uploadStatus"></p></form>
<h2>Your Songs</h2><div id="adminSongs"></div></div>
</main>
<script type="module" src="admin.js"></script>
</body></html>
